# /etc/egpu-tools.conf: settings for egpu-on / egpu-off (egpu-tools).
# KEY=VALUE lines; the file is parsed, not executed. Leave a value empty to
# use auto-detection / the default.

# PCI vendor:device of the eGPU, as shown by `lspci -nn` (e.g. 1002:744c).
# Empty: the first display device behind a Thunderbolt/USB4 port.
EGPU_PCI_ID=

# Thunderbolt device_name of the enclosure, as shown by `boltctl list`
# (e.g. Core X V2). Empty: the first Thunderbolt/USB4 device. Set this if you
# also use a Thunderbolt dock.
EGPU_TB_NAME=

# egpu-on: seconds to wait for the enclosure to appear (--wait overrides).
EGPU_WAIT_TB=120

# egpu-on: seconds to wait for the GPU driver to bind after a PCI rescan.
EGPU_WAIT_GPU=45

# egpu-off: seconds to wait for each PCI function to be removed.
EGPU_REMOVE_TIMEOUT=90

# egpu-off: extra process names (as in /proc/PID/comm, max 15 chars),
# space-separated, that may hold the eGPU during a detach without blocking it.
EGPU_ALLOW_EXTRA=
